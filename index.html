
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para mi Karen ❤️</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(135deg, #4b002e, #d63384, #ff8fa3);
}
h1 { font-size: 2.5rem; }
p { font-size: 1.4rem; }
.rosa { font-size: 5rem; animation: latir 1.2s infinite; }
.corazon {
  position: absolute;
  bottom: -40px;
  animation: subir 7s linear infinite;
}
@keyframes latir {
  50% { transform: scale(1.2); }
}
@keyframes subir {
  to { transform: translateY(-110vh) rotate(360deg); }
}
</style>
</head>
<body>
<div class="rosa">🌹</div>
<h1>¡Feliz Cumpleaños!</h1>
<h2>Mi Amor, mi Karen hermosa ❤️</h2>
<p>Te amo con todo mi corazón 💖</p>
<p>Que tu vida esté llena de amor y felicidad.</p>
<script>
function crearCorazon() {
  const c = document.createElement("div");
  c.className = "corazon";
  c.textContent = ["❤️","💕","🌸","✨","🌹"][Math.floor(Math.random()*5)];
  c.style.left = Math.random()*100 + "vw";
  c.style.animationDuration = (5 + Math.random()*4) + "s";
  c.style.fontSize = (18 + Math.random()*20) + "px";
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 9000);
}
setInterval(crearCorazon, 600);
</script>
</body>
</html>
